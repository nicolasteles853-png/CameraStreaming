# ============================================
# Configuração Servidor HTTP (Express.js)
# ============================================

# Porta do servidor HTTP
PORT=3000

# Porta do servidor TCP (stream)
STREAM_PORT=3001

# Diretório dos segmentos HLS
STREAMS_DIR=./streams

# Nome da playlist HLS
PLAYLIST_FILE=stream.m3u8

# Prefixo dos segmentos
SEGMENT_PREFIX=segment

# URL de acesso (para o VideoView)
# http://192.168.0.172:3000/streams/stream.m3u8

# Health check endpoint
# http://192.168.0.172:3000/health
