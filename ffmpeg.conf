# ============================================
# Configuração FFmpeg para HLS Low Latency
# ============================================

# Formato de entrada (H.264 raw via pipe)
-f h264
-i pipe:0

# Codec (cópia direta, sem re-encoding)
-c:v copy

# Sem áudio
-an

# Configurações HLS
-hls_time 2
-hls_list_size 5
-hls_flags delete_segments+omit_endlist+discont_start
-hls_segment_filename streams/segment%d.ts

# Output
streams/stream.m3u8

# Low latency
-pix_fmt yuv420p
-fflags nobuffer
-flags low_delay
-probesize 32
