# ============================================
# Configurações HLS para VideoView Android
# ============================================

# Duração de cada segmento (segundos)
# Valor baixo = menor latência, mais requests
# Valor alto = maior latência, menos requests
SEGMENT_DURATION=2

# Número máximo de segmentos na playlist
# 5 segmentos de 2s = 10s de buffer máximo
PLAYLIST_SIZE=5

# Flags HLS
# - delete_segments: remove segmentos antigos
# - omit_endlist: não fecha a playlist (live)
# - discont_start: permite descontinuidade no início
HLS_FLAGS=delete_segments+omit_endlist+discont_start

# Formato dos segmentos
# Segmentos nomeados: segment1.ts, segment2.ts, ...
SEGMENT_PATTERN=segment%d.ts

# Playlist resultante
# streams/stream.m3u8
PLAYLIST_NAME=stream.m3u8

# ============================================
# Estrutura de Pastas
# ============================================
# 
# project/
# ├── streams/
# │   ├── stream.m3u8
# │   ├── segment1.ts
# │   ├── segment2.ts
# │   ├── segment3.ts
# │   ├── segment4.ts
# │   └── segment5.ts
# ├── server.js
# ├── ffmpeg.conf
# ├── http.conf
# └── HLS.conf
#
# ============================================
# URL para VideoView
# ============================================
# http://192.168.0.172:3000/streams/stream.m3u8
#
# ============================================
# Latência Esperada
# ============================================
# - Segment duration: 2s
# - Playlist size: 5
# - Buffer mínimo: 2-3 segmentos
# - Latência total: 4-6 segundos
# ============================================
